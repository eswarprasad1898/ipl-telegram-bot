name: Run IPL Bot

on:
  schedule:
    - cron: '32 9 * * *'  # 3:02 PM IST = 9:32 AM UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install pytz

      - name: Run script
        run: python bot.py
